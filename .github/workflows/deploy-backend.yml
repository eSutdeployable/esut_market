name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "drizzle/**"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" \
            "GITHUB_TOKEN='$GITHUB_TOKEN' GITHUB_REPOSITORY='$GITHUB_REPOSITORY' bash -s" <<'REMOTE'
          set -e
          release="/var/www/esut-marketplace/releases/$(date +%Y%m%d%H%M%S)"
          mkdir -p "$release"
          git clone --depth 1 --branch main "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$release"
          cd "$release"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run deploy:verify
          ln -sfn "$release" /var/www/esut-marketplace/current
          sudo systemctl restart esut-marketplace
          curl --fail --silent --show-error https://api.esutmarketplace.com/healthz
          REMOTE